name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare index.html
        run: |
          if [ ! -f index.html ]; then
            HTML_FILE=$(ls *.html 2>/dev/null | head -n 1)
            if [ -n "$HTML_FILE" ]; then
              cp "$HTML_FILE" index.html
              echo "Copied $HTML_FILE → index.html"
            else
              echo "ERROR: No HTML file found in repo root!" && exit 1
            fi
          else
            echo "index.html already exists."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
