<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة شفاء السودان | Shifaa Sudan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://qhjszxgjdaxzenirfbtc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoanN6eGdqZGF4emVuaXJmYnRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NDU2MTgsImV4cCI6MjA5NTIyMTYxOH0.5L1lO0IBN6hvRVBXzvErlmcQPVJ3jsoVpr7zlHlmcpg';

        window.supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentProfile = null;

        window.showLanding = () => {
            document.getElementById('landing-page').classList.remove('hidden');
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            loadStats();
        }

        window.showLogin = () => {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        }

        window.showRegister = (type) => {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
            document.getElementById('doctor-fields').classList.add('hidden');
            document.getElementById('volunteer-fields').classList.add('hidden');
            window.currentRoleType = type;

            if (type === 'doctor') {
                document.getElementById('register-title').innerText = 'تسجيل طبيب جديد';
                document.getElementById('doctor-fields').classList.remove('hidden');
            } else {
                document.getElementById('register-title').innerText = 'تسجيل متطوع ميداني';
                document.getElementById('volunteer-fields').classList.remove('hidden');
            }
        }

        window.register = async () => {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const full_name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;

            const { data: authData, error: authError } = await window.supabaseClient.auth.signUp({ email, password });
            if (authError) return alert('خطأ: ' + authError.message);

            const profileData = {
                id: authData.user.id, email, full_name, phone,
                role: window.currentRoleType === 'doctor'? 'doctor' : 'field_volunteer',
                is_active: false
            };

            if (window.currentRoleType === 'doctor') {
                profileData.specialty = document.getElementById('reg-specialty').value;
                profileData.medical_license_number = document.getElementById('reg-license').value;
                const file = document.getElementById('reg-certificate').files[0];
                if (file) {
                    const { data, error } = await window.supabaseClient.storage.from('certificates').upload(`${authData.user.id}.pdf`, file);
                    if (!error) profileData.certificate_url = data.path;
                }
            } else {
                profileData.location = document.getElementById('reg-location').value;
            }

            await window.supabaseClient.from('profiles').insert(profileData);
            alert('تم التسجيل بنجاح! سيتم تفعيل حسابك بعد المراجعة');
            window.showLanding();
        }

        window.login = async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
            if (error) return alert('خطأ: ' + error.message);

            const { data: profile } = await window.supabaseClient.from('profiles').select('*').eq('id', data.user.id).single();
            if (!profile) return alert('لم يتم العثور على الملف الشخصي');
            if (!profile.is_active) return alert('حسابك غير مفعل بعد. انتظر موافقة الأدمن');

            currentUser = data.user;
            currentProfile = profile;
            loadDashboard(profile);
        }

        window.logout = async () => {
            await window.supabaseClient.auth.signOut();
            currentUser = null;
            currentProfile = null;
            document.getElementById('login-btn').classList.remove('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
            window.showLanding();
        }

        async function loadDashboard(profile) {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');

            const dash = document.getElementById('dashboard');
            if (profile.role === 'admin') {
                dash.innerHTML = `
                    <h2 class="text-3xl font-bold mb-6">لوحة تحكم الأدمن - ${profile.full_name}</h2>
                    <div id="admin-content">جاري تحميل طلبات التفعيل...</div>`;
                loadAdminPanel();
            } else if (profile.role === 'doctor') {
                dash.innerHTML = `
                    <h2 class="text-3xl font-bold mb-6">لوحة الطبيب - د. ${profile.full_name}</h2>
                    <div id="doctor-cases">جاري تحميل الحالات...</div>`;
                loadDoctorCases(profile.id);
            } else if (profile.role === 'field_volunteer') {
                dash.innerHTML = `
                    <h2 class="text-3xl font-bold mb-6">لوحة المتطوع - ${profile.full_name}</h2>
                    <button onclick="showNewCaseForm()" class="bg-green-600 text-white px-6 py-3 rounded-lg mb-6">+ إضافة حالة جديدة</button>
                    <div id="volunteer-cases">جاري تحميل حالاتك...</div>`;
                loadVolunteerCases(profile.id);
            } else if (profile.role === 'medical_supervisor') {
                dash.innerHTML = `
                    <h2 class="text-3xl font-bold mb-6">لوحة المشرف الطبي - ${profile.full_name}</h2>
                    <div id="triage-cases">جاري تحميل حالات الترياج...</div>`;
                loadTriageCases();
            }
        }

        async function loadStats() {
            const { count: doctors } = await window.supabaseClient.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'doctor').eq('is_active', true);
            const { count: volunteers } = await window.supabaseClient.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'field_volunteer').eq('is_active', true);
            const { count: cases } = await window.supabaseClient.from('cases').select('*', { count: 'exact', head: true }).eq('status', 'مغلقة');
            const { count: active } = await window.supabaseClient.from('cases').select('*', { count: 'exact', head: true }).neq('status', 'مغلقة');

            document.getElementById('stat-doctors').innerText = doctors || 0;
            document.getElementById('stat-volunteers').innerText = volunteers || 0;
            document.getElementById('stat-cases').innerText = cases || 0;
            document.getElementById('stat-active').innerText = active || 0;
        }

        async function loadAdminPanel() {
            const { data: pending } = await window.supabaseClient.from('profiles').select('*').eq('is_active', false);
            let html = '<h3 class="text-xl font-bold mb-4">طلبات التفعيل المعلقة</h3>';
            if (!pending || pending.length === 0) html += '<p>لا توجد طلبات جديدة</p>';
            else {
                html += '<div class="space-y-4">';
                pending.forEach(p => {
                    html += `<div class="bg-white p-4 rounded shadow flex justify-between items-center">
                        <div><b>${p.full_name}</b> - ${p.role === 'doctor'? 'طبيب ' + p.specialty : 'متطوع ميداني'}<br>${p.email}</div>
                        <button onclick="activateUser('${p.id}')" class="bg-green-600 text-white px-4 py-2 rounded">تفعيل</button>
                    </div>`;
                });
                html += '</div>';
            }
            document.getElementById('admin-content').innerHTML = html;
        }

        window.activateUser = async (userId) => {
            await window.supabaseClient.from('profiles').update({ is_active: true }).eq('id', userId);
            loadAdminPanel();
        }

        window.showNewCaseForm = () => {
            document.getElementById('dashboard').innerHTML = `
                <h2 class="text-3xl font-bold mb-6">إضافة حالة جديدة</h2>
                <div class="bg-white p-6 rounded-lg shadow max-w-2xl">
                    <input id="case-name" placeholder="اسم المريض" class="w-full p-3 mb-4 border rounded">
                    <input id="case-age" type="number" placeholder="العمر" class="w-full p-3 mb-4 border rounded">
                    <select id="case-gender" class="w-full p-3 mb-4 border rounded">
                        <option value="">الجنس</option><option value="ذكر">ذكر</option><option value="أنثى">أنثى</option>
                    </select>
                    <textarea id="case-desc" placeholder="وصف الحالة والأعراض" class="w-full p-3 mb-4 border rounded h-32"></textarea>
                    <select id="case-urgency" class="w-full p-3 mb-4 border rounded">
                        <option value="عادية">عادية</option><option value="متوسطة">متوسطة</option><option value="عاجلة">عاجلة</option>
                    </select>
                    <label class="block mb-2">صور الحالة</label>
                    <input id="case-images" type="file" multiple accept="image/*" class="w-full p-3 mb-4 border rounded">
                    <button onclick="submitCase()" class="w-full bg-blue-900 text-white p-3 rounded font-bold">إرسال الحالة</button>
                    <button onclick="loadDashboard(currentProfile)" class="w-full mt-2 text-gray-600">إلغاء</button>
                </div>`;
        }

        window.submitCase = async () => {
            const caseData = {
                patient_name: document.getElementById('case-name').value,
                patient_age: document.getElementById('case-age').value,
                patient_gender: document.getElementById('case-gender').value,
                description: document.getElementById('case-desc').value,
                urgency: document.getElementById('case-urgency').value,
                volunteer_id: currentUser.id,
                status: 'جديدة'
            };

            const { data: newCase, error } = await window.supabaseClient.from('cases').insert(caseData).select().single();
            if (error) return alert('خطأ: ' + error.message);

            const files = document.getElementById('case-images').files;
            for (let file of files) {
                const path = `cases/${newCase.id}/${Date.now()}-${file.name}`;
                await window.supabaseClient.storage.from('case-images').upload(path, file);
                await window.supabaseClient.from('case_images').insert({ case_id: newCase.id, image_url: path });
            }

            alert('تم إرسال الحالة بنجاح');
            loadDashboard(currentProfile);
        }

        async function loadVolunteerCases(userId) {
            const { data: cases } = await window.supabaseClient.from('cases').select('*').eq('volunteer_id', userId).order('created_at', { ascending: false });
            let html = '';
            if (cases && cases.length > 0) {
                cases.forEach(c => {
                    html += `<div class="bg-white p-4 rounded shadow mb-4">
                        <div class="flex justify-between"><b>${c.patient_name}</b><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-sm">${c.status}</span></div>
                        <p class="text-gray-600 text-sm mt-2">${c.description.substring(0, 100)}...</p>
                    </div>`;
                });
            }
            document.getElementById('volunteer-cases').innerHTML = html || 'لا توجد حالات بعد';
        }

        async function loadDoctorCases(userId) {
            const { data: cases } = await window.supabaseClient.from('cases').select('*').eq('assigned_doctor_id', userId).order('created_at', { ascending: false });
            let html = '';
            if (cases && cases.length > 0) {
                cases.forEach(c => {
                    html += `<div class="bg-white p-4 rounded shadow mb-4">
                        <div class="flex justify-between"><b>${c.patient_name}</b><span class="bg-orange-100 text-orange-800 px-2 py-1 rounded text-sm">${c.urgency}</span></div>
                        <p class="text-gray-600 text-sm mt-2">${c.description.substring(0, 100)}...</p>
                        <button onclick="openCase('${c.id}')" class="mt-2 bg-blue-600 text-white px-4 py-1 rounded text-sm">فتح الحالة</button>
                    </div>`;
                });
            }
            document.getElementById('doctor-cases').innerHTML = html || 'لا توجد حالات مسندة لك حالياً';
        }

        async function loadTriageCases() {
            const { data: cases } = await window.supabaseClient.from('cases').select('*').eq('status', 'جديدة').order('created_at', { ascending: true });
            const { data: doctors } = await window.supabaseClient.from('profiles').select('*').eq('role', 'doctor').eq('is_active', true);

            let html = '';
            if (cases && cases.length > 0) {
                cases.forEach(c => {
                    let doctorOptions = doctors.map(d => `<option value="${d.id}">د. ${d.full_name} - ${d.specialty || 'عام'}</option>`).join('');
                    html += `<div class="bg-white p-4 rounded shadow mb-4">
                        <b>${c.patient_name}</b> - ${c.urgency} - ${c.description.substring(0, 80)}...
                        <div class="mt-3 flex gap-2">
                            <select id="assign-${c.id}" class="border rounded p-2 flex-1"><option value="">اختر طبيب</option>${doctorOptions}</select>
                            <button onclick="assignCase('${c.id}')" class="bg-green-600 text-white px-4 py-2 rounded">إسناد</button>
                        </div>
                    </div>`;
                });
            }
            document.getElementById('triage-cases').innerHTML = html || 'لا توجد حالات جديدة للترياج';
        }

        window.assignCase = async (caseId) => {
            const doctorId = document.getElementById(`assign-${caseId}`).value;
            if (!doctorId) return alert('اختر طبيب أولاً');
            await window.supabaseClient.from('cases').update({ assigned_doctor_id: doctorId, status: 'قيد المعالجة' }).eq('id', caseId);
            loadTriageCases();
        }

        window.openCase = async (caseId) => {
            const { data: c } = await window.supabaseClient.from('cases').select('*, case_images(image_url)').eq('id', caseId).single();
            const images = c.case_images? c.case_images.map(img => `<img src="${window.supabaseClient.storage.from('case-images').getPublicUrl(img.image_url).data.publicUrl}" class="w-32 h-32 object-cover rounded">`).join('') : '';

            document.getElementById('dashboard').innerHTML = `
                <button onclick="loadDashboard(currentProfile)" class="mb-4 text-blue-600">← رجوع</button>
                <h2 class="text-3xl font-bold mb-4">حالة: ${c.patient_name}</h2>
                <div class="bg-white p-6 rounded-lg shadow">
                    <p><b>العمر:</b> ${c.patient_age} | <b>الجنس:</b> ${c.patient_gender} | <b>الخطورة:</b> ${c.urgency}</p>
                    <p class="mt-4"><b>الوصف:</b><br>${c.description}</p>
                    <div class="mt-4 flex gap-2 flex-wrap">${images}</div>
                    <div class="mt-6">
                        <h3 class="font-bold mb-2">إضافة تشخيص ووصفة</h3>
                        <textarea id="diagnosis" placeholder="التشخيص" class="w-full p-3 mb-2 border rounded h-24"></textarea>
                        <textarea id="prescription" placeholder="الوصفة الطبية" class="w-full p-3 mb-2 border rounded h-24"></textarea>
                        <button onclick="closeCase('${c.id}')" class="bg-green-600 text-white px-6 py-2 rounded">إغلاق الحالة</button>
                    </div>
                </div>`;
        }

        window.closeCase = async (caseId) => {
            const diagnosis = document.getElementById('diagnosis').value;
            const prescription = document.getElementById('prescription').value;
            await window.supabaseClient.from('cases').update({
                diagnosis, prescription, status: 'مغلقة', closed_at: new Date().toISOString()
            }).eq('id', caseId);
            alert('تم إغلاق الحالة بنجاح');
            loadDashboard(currentProfile);
        }

        window.supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                window.supabaseClient.from('profiles').select('*').eq('id', session.user.id).single().then(({ data }) => {
                    if (data && data.is_active) {
                        currentUser = session.user;
                        currentProfile = data;
                        loadDashboard(data);
                    }
                });
            } else {
                window.showLanding();
            }
        });
    </script>
</head>
<body class="bg-gray-50">
    <div id="app">
        <nav class="bg-blue-900 text-white p-4 shadow-lg">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold">منصة شفاء السودان</h1>
                <div id="nav-buttons">
                    <button onclick="showLogin()" id="login-btn" class="bg-white text-blue-900 px-4 py-2 rounded font-bold">تسجيل الدخول</button>
                    <button onclick="logout()" id="logout-btn" class="hidden bg-red-600 px-4 py-2 rounded font-bold">خروج</button>
                </div>
            </div>
        </nav>

        <div id="landing-page" class="container mx-auto p-8">
            <div class="text-center mb-12">
                <h2 class="text-4xl font-extrabold text-blue-900 mb-4">مرحباً بكم في شفاء</h2>
                <p class="text-xl text-gray-700 mb-8">منصة طبية تطوعية لربط المرضى بالأطباء في السودان</p>
                <div class="flex gap-4 justify-center">
                    <button onclick="showRegister('volunteer')" class="bg-green-600 text-white px-8 py-3 rounded-lg text-lg font-bold">تسجيل كمتطوع ميداني</button>
                    <button onclick="showRegister('doctor')" class="bg-blue-600 text-white px-8 py-3 rounded-lg text-lg font-bold">تسجيل كطبيب</button>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
                <div class="bg-white p-6 rounded-lg shadow text-center">
                    <div class="text-3xl font-bold text-blue-900" id="stat-doctors">0</div>
                    <div class="text-gray-600">طبيب متطوع</div>
                </div>
                <div class="bg-white p-6 rounded-lg shadow text-center">
                    <div class="text-3xl font-bold text-green-600" id="stat-volunteers">0</div>
                    <div class="text-gray-600">متطوع ميداني</div>
                </div>
                <div class="bg-white p-6 rounded-lg shadow text-center">
                    <div class="text-3xl font-bold text-orange-600" id="stat-cases">0</div>
                    <div class="text-gray-600">حالة تم علاجها</div>
                </div>
                <div class="bg-white p-6 rounded-lg shadow text-center">
                    <div class="text-3xl font-bold text-purple-600" id="stat-active">0</div>
                    <div class="text-gray-600">حالة نشطة الآن</div>
                </div>
            </div>
        </div>

        <div id="login-form" class="hidden container mx-auto p-8 max-w-md">
            <div class="bg-white p-8 rounded-lg shadow-lg">
                <h3 class="text-2xl font-bold mb-6 text-center">تسجيل الدخول</h3>
                <input type="email" id="login-email" placeholder="البريد الإلكتروني" class="w-full p-3 mb-4 border rounded">
                <input type="password" id="login-password" placeholder="كلمة المرور" class="w-full p-3 mb-4 border rounded">
                <button onclick="login()" class="w-full bg-blue-900 text-white p-3 rounded font-bold">دخول</button>
                <button onclick="showLanding()" class="w-full mt-2 text-gray-600">رجوع</button>
            </div>
        </div>

        <div id="register-form" class="hidden container mx-auto p-8 max-w-2xl">
            <div class="bg-white p-8 rounded-lg shadow-lg">
                <h3 class="text-2xl font-bold mb-6 text-center" id="register-title">تسجيل جديد</h3>
                <input type="text" id="reg-name" placeholder="الاسم الكامل" class="w-full p-3 mb-4 border rounded">
                <input type="email" id="reg-email" placeholder="البريد الإلكتروني" class="w-full p-3 mb-4 border rounded">
                <input type="password" id="reg-password" placeholder="كلمة المرور" class="w-full p-3 mb-4 border rounded">
                <input type="tel" id="reg-phone" placeholder="رقم الهاتف" class="w-full p-3 mb-4 border rounded">

                <div id="doctor-fields" class="hidden">
                    <select id="reg-specialty" class="w-full p-3 mb-4 border rounded">
                        <option value="">اختر التخصص</option>
                        <option value="باطنية">باطنية</option>
                        <option value="أطفال">أطفال</option>
                        <option value="قلب">قلب</option>
                        <option value="جراحة">جراحة</option>
                        <option value="نساء وتوليد">نساء وتوليد</option>
                        <option value="عمومي">طبيب عمومي</option>
                    </select>
                    <input type="text" id="reg-license" placeholder="رقم الرخصة الطبية" class="w-full p-3 mb-4 border rounded">
                    <label class="block mb-2">شهادة التخرج / الرخصة PDF</label>
                    <input type="file" id="reg-certificate" accept=".pdf" class="w-full p-3 mb-4 border rounded">
                </div>

                <div id="volunteer-fields" class="hidden">
                    <input type="text" id="reg-location" placeholder="الولاية / المدينة" class="w-full p-3 mb-4 border rounded">
                </div>

                <button onclick="register()" class="w-full bg-green-600 text-white p-3 rounded font-bold">تسجيل</button>
                <button onclick="showLanding()" class="w-full mt-2 text-gray-600">رجوع</button>
            </div>
        </div>

        <div id="dashboard" class="hidden container mx-auto p-8"></div>
    </div>
</body>
</html>
